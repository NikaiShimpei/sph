        // 回答をDifyに送信（判定結果を受け取る）
        async function sendQuizAnswer(selectedAnswer) {
            // クイズを閉じる
            closeQuiz();
            
            // ユーザーの回答をチャットに表示
            addMessage(`選択した答え: ${selectedAnswer}`, 'user');
            
            // Difyに回答を送信
            const loadingId = addMessage('考え中...', 'bot', true);
            
            try {
                const payload = {
                    inputs: {},
                    query: selectedAnswer,
                    response_mode: "blocking",
                    user: "guest-user",
                    files: []
                };
                
                if (currentConversationId) {
                    payload.conversation_id = currentConversationId;
                }
                
                const response = await fetch(`${BASE_URL}/chat-messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.conversation_id) {
                    currentConversationId = data.conversation_id;
                }
                
                const loadingMsg = document.getElementById(loadingId);
                if(loadingMsg) loadingMsg.remove();
                
                const aiResponse = data.answer;
                
                // 固定クイズモード中の場合、次の問題が含まれているかチェック
                if (isFixedQuizMode) {
                    // 次の問題を検出
                    const nextQuizData = detectQuiz(aiResponse);
                    
                    if (nextQuizData) {
                        // 次の問題が含まれている場合
                        currentQuestionNumber++;
                        
                        // 判定と解説を先に表示
                        const answerData = parseAnswerResponse(aiResponse);
                        if (answerData) {
                            // 正解と解説をカードとして表示
                            addAnswerCard(answerData);
                        } else {
                            // 通常のメッセージとして表示
                            addMessage(aiResponse, 'bot');
                        }
                        
                        // 次の問題を直接全画面表示
                        setTimeout(() => {
                            startQuiz(nextQuizData);
                        }, 1000);
                    } else {
                        // 次の問題が含まれていない場合（全問終了の可能性）
                        if (aiResponse.includes(`全${fixedQuizQuestions.length}問終了`) || aiResponse.includes('お疲れ様でした')) {
                            isFixedQuizMode = false;
                            currentQuestionNumber = 0;
                        }
                        
                        // 判定と解説を表示
                        const answerData = parseAnswerResponse(aiResponse);
                        if (answerData) {
                            addAnswerCard(answerData);
                        } else {
                            addMessage(aiResponse, 'bot');
                        }
                    }
                } else {
                    // 通常モードの場合
                    // Difyからの回答を解析（正解、解説を抽出）
                    const answerData = parseAnswerResponse(aiResponse);
                    
                    if (answerData) {
                        // 正解と解説をカードとして表示
                        addAnswerCard(answerData);
                    } else {
                        // 通常のメッセージとして表示
                        addMessage(aiResponse, 'bot');
                    }
                }
                
            } catch (error) {
                console.error(error);
                const loadingMsg = document.getElementById(loadingId);
                if(loadingMsg) loadingMsg.innerText = "エラーが発生しました。通信環境などを確認してください。";
            }
        }
        
        // Difyからの回答を解析（正解と解説を抽出）
        function parseAnswerResponse(text) {
            const normalizedText = text.replace(/<br\s*\/?>/gi, '\n').replace(/&nbsp;/g, ' ');
            
            // 判定を検出
            const judgmentPattern = /判定[:：]\s*(.+?)(?:\n|$)/i;
            const judgmentMatch = normalizedText.match(judgmentPattern);
            const judgment = judgmentMatch ? judgmentMatch[1].trim() : '';
            
            // 正解を検出
            const answerPattern = /正解[:：]\s*([A-D])/i;
            const answerMatch = normalizedText.match(answerPattern);
            const correctAnswer = answerMatch ? answerMatch[1].toUpperCase() : null;
            
            // 解説を検出
            const explanationPattern = /解説[:：]\s*(.+?)(?:\n\n|$)/is;
            const explanationMatch = normalizedText.match(explanationPattern);
            let explanation = '';
            if (explanationMatch) {
                explanation = explanationMatch[1].trim()
                    .replace(/\n+/g, ' ')
                    .replace(/\s+/g, ' ')
                    .replace(/<br\s*\/?>/gi, ' ');
            }
            
            if (judgment || correctAnswer || explanation) {
                return {
                    judgment: judgment,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    fullText: text
                };
            }
            
            return null;
        }
        
        // 正解と解説をカードとして表示
        function addAnswerCard(answerData) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message bot';
            
            // 回答データを保存（全画面表示時に使用）
            const answerId = 'answer-' + Date.now();
            div.dataset.answerId = answerId;
            window[answerId] = answerData;
            
            // チャット画面では判定結果を表示せず、全画面表示時にのみ表示
            div.innerHTML = `
                <div class="message-text">
                    <div class="quiz-card" onclick="showAnswer('${answerId}')">
                        <h3>✅ 正解はこちら！</h3>
                        <p>結果を確認する</p>
                        <button>全画面で表示する</button>
                    </div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // 全画面で正解と解説を表示（パネルではなく通常のテキスト）
        function showAnswer(answerId) {
            const answerData = window[answerId];
            if (!answerData) return;
            
            // オーバーレイを表示
            const overlay = document.getElementById('quiz-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('show'), 10);
            
            // 判定を表示（問題エリアを使用）
            const questionWrapper = document.getElementById('quiz-question-wrapper');
            const questionIntro = document.getElementById('quiz-question-intro');
            const questionMain = document.getElementById('quiz-question-main');
            const questionComment = document.getElementById('quiz-question-comment');
            const timerElement = document.getElementById('quiz-timer');
            
            // タイマーを非表示
            if (timerElement) {
                timerElement.style.display = 'none';
            }
            
            // 前口上を非表示
            if (questionIntro) {
                questionIntro.style.display = 'none';
            }
            
            // コメントを非表示
            if (questionComment) {
                questionComment.style.display = 'none';
            }
            
            // 判定を問題文エリアに表示
            if (questionMain) {
                const safeJudgment = answerData.judgment
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                    .replace(/\n/g, '<br>');
                questionMain.innerHTML = safeJudgment || '結果';
            }
            
            // 選択肢エリアを非表示
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            optionsContainer.style.display = 'none';
            
            // 正解を表示（通常のテキスト、パネル表示ではない）
            const feedbackDiv = document.getElementById('quiz-feedback');
            if (answerData.correctAnswer) {
                feedbackDiv.innerHTML = `<strong>正解：</strong>${answerData.correctAnswer}`;
                feedbackDiv.className = 'correct';
                feedbackDiv.style.display = 'block';
            } else {
                feedbackDiv.innerHTML = '';
                feedbackDiv.className = '';
            }
            
            // 解説を表示（通常のテキスト、パネル表示ではない）
            const explanationDiv = document.getElementById('quiz-explanation');
            if (answerData.explanation) {
                const safeExplanation = answerData.explanation
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                    .replace(/\n/g, '<br>');
                explanationDiv.innerHTML = `<strong>解説：</strong>${safeExplanation}`;
                explanationDiv.style.display = 'block';
            } else {
                explanationDiv.innerHTML = '';
            }
            
            // 閉じるボタンのみ表示
            const actionsDiv = document.getElementById('quiz-actions');
            actionsDiv.innerHTML = '';
            actionsDiv.style.display = 'flex'; // 閉じるボタン表示時に表示
            const closeBtn = document.createElement('button');
            closeBtn.className = 'quiz-action-btn';
            closeBtn.textContent = '閉じる';
            closeBtn.onclick = function() {
                closeQuiz();
            };
            actionsDiv.appendChild(closeBtn);
        }

        // タイマーを開始
        function startTimer() {
            // 既存のタイマーをクリア
            if (quizTimer) {
                clearInterval(quizTimer);
            }
            
            const timerElement = document.getElementById('quiz-timer');
            timeRemaining = 60;
            timerElement.textContent = timeRemaining;
            timerElement.classList.remove('warning');
            
            quizTimer = setInterval(() => {
                timeRemaining--;
                timerElement.textContent = timeRemaining;
                
                // 10秒以下になったら警告表示
                if (timeRemaining <= 10) {
                    timerElement.classList.add('warning');
                }
                
                // 時間切れ
                if (timeRemaining <= 0) {
                    clearInterval(quizTimer);
                    timerElement.textContent = 'TIME UP!';
                    // 自動的に最初の選択肢を選択（または何もしない）
                    // ここでは何もしない（ユーザーが選択できるようにする）
                }
            }, 1000);
        }
        
        // タイマーを停止
        function stopTimer() {
            if (quizTimer) {
                clearInterval(quizTimer);
                quizTimer = null;
            }
        }
        
        async function closeQuiz() {
            // タイマーを停止
            stopTimer();
            
            // クイズ音楽を停止し、チャット音楽を再開
            stopQuizMusic();
            
            // 固定クイズモード中に閉じた場合、Firebaseの状態を更新
            if (isFixedQuizMode && currentQuestionNumber >= 1 && currentQuestionNumber <= 10) {
                try {
                    const quizRef = database.ref('quizzes/current');
                    // currentQuestionを削除してから、statusを更新
                    await quizRef.child('currentQuestion').remove();
                    await quizRef.update({
                        status: 'ended',
                        endedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    // 固定クイズモードを解除
                    isFixedQuizMode = false;
                    currentQuestionNumber = 0;
                } catch (error) {
                    console.error('Firebase更新エラー:', error);
                }
            }
            
            const overlay = document.getElementById('quiz-overlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.style.display = 'none';
                // 状態をリセット
                quizAnswered = false;
                currentQuizData = null;
                timeRemaining = 60;
                const timerElement = document.getElementById('quiz-timer');
                if (timerElement) {
                    timerElement.textContent = timeRemaining;
                    timerElement.classList.remove('warning');
                }
            }, 300);
        }
        // ===== 音楽機能 =====
        let backgroundMusic = null;
        let quizMusic = null;
        let isMusicPlaying = false;
        let wasMusicPlayingBeforeQuiz = false; // クイズ開始前の音楽再生状態を記録

        function initMusic() {
            backgroundMusic = new Audio('chat/assets/music0.m4a');
            backgroundMusic.volume = 0.5;
            backgroundMusic.loop = true;
            // デフォルトはoffなので、初期化のみ
        }

        function initQuizMusic() {
            if (!quizMusic) {
                quizMusic = new Audio('chat/assets/music1.m4a');
                quizMusic.volume = 0.5;
                quizMusic.loop = true;
            }
        }

        function toggleMusic() {
            // クイズ中かどうかを判定
            const isQuizActive = isFixedQuizMode && currentQuestionNumber >= 1 && currentQuestionNumber <= 10;
            
            if (isQuizActive) {
                // クイズ中：music1を制御
                if (!quizMusic) {
                    initQuizMusic();
                }
                
                // 実際の再生状態を確認
                if (quizMusic && !quizMusic.paused) {
                    quizMusic.pause();
                    isMusicPlaying = false;
                } else {
                    quizMusic.play().catch(e => {
                        console.log('クイズ音楽の再生に失敗しました:', e);
                    });
                    isMusicPlaying = true;
                }
            } else {
                // チャット画面：music0を制御（クイズ音楽が再生中でも停止する）
                if (quizMusic && !quizMusic.paused) {
                    quizMusic.pause();
                    quizMusic.currentTime = 0;
                }
                
                if (!backgroundMusic) {
                    initMusic();
                }
                
                // 実際の再生状態を確認
                if (backgroundMusic && !backgroundMusic.paused) {
                    backgroundMusic.pause();
                    isMusicPlaying = false;
                } else {
                    backgroundMusic.play().catch(e => {
                        console.log('音楽の再生に失敗しました:', e);
                    });
                    isMusicPlaying = true;
                }
            }
            updateMusicButtonState();
        }

        function startQuizMusic() {
            // クイズ開始時：music0を停止し、music1を再生
            wasMusicPlayingBeforeQuiz = isMusicPlaying;
            
            if (backgroundMusic && !backgroundMusic.paused) {
                backgroundMusic.pause();
            }
            
            initQuizMusic();
            if (wasMusicPlayingBeforeQuiz) {
                quizMusic.play().catch(e => {
                    console.log('クイズ音楽の再生に失敗しました:', e);
                });
                isMusicPlaying = true;
            } else {
                isMusicPlaying = false;
            }
            // ボタンの状態を更新（クイズ音楽の状態を反映）
            updateMusicButtonState();
        }

        function stopQuizMusic() {
            // クイズ終了時：music1を停止し、music0を再開（元々再生していた場合）
            if (quizMusic && !quizMusic.paused) {
                quizMusic.pause();
                quizMusic.currentTime = 0;
            }
            
            // チャット画面に戻ったので、music0の状態に合わせる
            if (wasMusicPlayingBeforeQuiz && backgroundMusic) {
                backgroundMusic.play().catch(e => {
                    console.log('音楽の再生に失敗しました:', e);
                });
                isMusicPlaying = true;
            } else {
                isMusicPlaying = false;
            }
            
            // ボタンの状態を更新（チャット音楽の状態を反映）
            updateMusicButtonState();
        }

        function updateMusicButtonState() {
            const button = document.getElementById('music-toggle');
            // クイズ中かどうかを判定
            const isQuizActive = isFixedQuizMode && currentQuestionNumber >= 1 && currentQuestionNumber <= 10;
            
            if (isQuizActive) {
                // クイズ中：quizMusicの状態を確認
                if (quizMusic && !quizMusic.paused) {
                    button.textContent = '🔊';
                    button.classList.remove('muted');
                } else {
                    button.textContent = '🔇';
                    button.classList.add('muted');
                }
            } else {
                // チャット画面：backgroundMusicの状態を確認
                if (backgroundMusic && !backgroundMusic.paused) {
                    button.textContent = '🔊';
                    button.classList.remove('muted');
                } else {
                    button.textContent = '🔇';
                    button.classList.add('muted');
                }
            }
        }

        // ページ読み込み時に音楽を初期化（デフォルトはoff）
        window.addEventListener('load', () => {
            initMusic();
            updateMusicButtonState();
            
            // URLパラメータでクイズ開始をチェック
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('startQuiz') === 'true') {
                // オープニング画面から来た場合、直接クイズを開始
                setTimeout(() => {
                    isFixedQuizMode = true;
                    currentQuestionNumber = 1;
                    addMessage('それでは、クイズ!  アルマ マーテル 開始！', 'bot');
                    setTimeout(() => {
                        startFixedQuiz(1);
                    }, 500);
                }, 500);
            }
        });

        // ページを離れるときに音楽を停止
        window.addEventListener('beforeunload', () => {
            if (backgroundMusic) {
                backgroundMusic.pause();
            }
        });

    </script>
</body>
