<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="上智大学クイズチャット">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nikaishimpei.github.io/sph/">
    <title>Sophian Quiz Chat</title>
    <!-- Google Fonts: Mplus 1p -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Dify API設定（機密情報） -->
    <script src="config.js"></script>
    <style>
        /* --- 上智大学ブランドカラー定義 --- */
        :root {
            --sophia-claret: #9E1B32; /* メインカラー（エンジ） */
            --urban-navy: #1C2538;    /* サポートカラー（紺） */
            --urban-gray-dark: #606875; /* サポートカラー（濃灰） */
            --urban-gray-light: #95A0AB; /* サポートカラー（薄灰） */
            --bg-color: #F5F6F8;      /* 背景色（薄いグレー） */
        }

        /* --- 基本設定 --- */
        body { 
            font-family: "M PLUS 1p", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            background-image: url('chat/assets/1gokan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            color: var(--urban-navy);
            position: relative;
            animation: backgroundZoom 20s ease-in-out infinite;
        }

        @keyframes backgroundZoom {
            0%, 100% {
                background-size: 100% auto;
            }
            50% {
                background-size: 110% auto;
            }
        }

        /* --- 音楽ボタン --- */
        #music-toggle {
            position: fixed;
            top: 2vh;
            left: 2vw;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        #music-toggle:hover {
            background-color: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }

        #music-toggle.muted {
            opacity: 0.5;
        }

        /* --- キャラクターコンテナ（左上に配置） --- */
        #character-container {
            position: fixed;
            top: 80px;
            left: -80px;
            width: 364px;
            height: auto;
            z-index: 100;
            pointer-events: none;
        }

        #character-container img {
            width: 100%;
            height: auto;
        }
        
        /* --- チャットエリア --- */
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px 20px 100px 50px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            background: transparent;
        }
        
        /* メッセージ共通スタイル */
        .message { 
            max-width: 90%; 
            padding: 30px 40px; 
            border-radius: 24px; 
            font-size: clamp(36px, 4.5vw, 54px);
            line-height: 2.0; 
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* ユーザーのメッセージ（右側） */
        .message.user { 
            align-self: flex-end; 
            background-color: var(--urban-navy); 
            color: white; 
            border-bottom-right-radius: 4px; 
            font-size: clamp(36px, 4.5vw, 54px);
        }

        /* ボットのメッセージ（左側） */
        .message.bot { 
            align-self: flex-start; 
            background-color: rgba(255, 255, 255, 0.95); 
            color: var(--urban-navy); 
            border-bottom-left-radius: 4px; 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            border: none;
            margin-left: 200px;
            max-width: 60%;
            min-height: auto;
            padding: 30px 50px;
            position: relative;
        }

        /* ボットメッセージの吹き出し（CSSで作成） */
        .message.bot::before {
            content: '';
            position: absolute;
            left: -20px;
            bottom: 30px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 20px 0 0;
            border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
        }

        .message.bot .message-text {
            font-size: clamp(28.5px, 3.6vw, 43.5px);
            line-height: 1.8;
            flex: 1;
        }
        
        /* アイコン画像のスタイル */
        .avatar { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--sophia-claret); 
            flex-shrink: 0;
        }

        /* クイズ開始カード（チャット内） */
        .quiz-card { 
            background: #fff; 
            border-left: 5px solid var(--sophia-claret); 
            padding: 15px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-top: 5px;
        }
        .quiz-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(158, 27, 50, 0.15); 
        }
        .quiz-card h3 { 
            margin: 0 0 8px 0; 
            color: var(--sophia-claret); 
            font-size: 1.1em;
        }
        .quiz-card p {
            margin: 0 0 15px 0;
            color: var(--urban-gray-dark);
            font-size: 0.9em;
        }
        .quiz-card button { 
            background: var(--sophia-claret); 
            color: white; 
            border: none; 
            padding: 8px 25px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .quiz-card button:hover {
            background-color: #7a1526;
        }

        /* --- 入力エリア（右下に配置） --- */
        #input-area { 
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 7px 16px; 
            background: white; 
            display: flex; 
            gap: 8px; 
            border-top: 1px solid #e0e0e0; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
            max-width: 1200px;
            min-width: 600px;
            z-index: 200;
        }
        input { 
            flex: 2; 
            padding: 6px 16px; 
            font-size: 14px; 
            border: 2px solid #e0e0e0; 
            border-radius: 30px; 
            outline: none; 
            transition: border-color 0.2s;
            color: var(--urban-navy);
        }
        input:focus {
            border-color: var(--sophia-claret);
        }
        #send-btn { 
            background-color: var(--sophia-claret); 
            color: white; 
            border: none; 
            padding: 0 30px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: background-color 0.2s;
        }
        #send-btn:hover {
            background-color: #7a1526;
        }

        /* --- 全画面クイズオーバーレイ（クイズミリオネア風、16:9最適化） --- */
        #quiz-overlay {
            display: none; /* 最初は隠す */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d0a15 0%, #460117 50%, #6f0125 100%);
            color: white;
            flex-direction: column; align-items: center; justify-content: flex-start; /* flex-startに変更 */
            z-index: 1000; padding: 2vh 3vw; box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            overflow-y: auto; /* 縦スクロールを有効化 */
            overflow-x: hidden; /* 横スクロールは無効化 */
        }
        
        /* 16:9アスペクト比の最適化 */
        @media (aspect-ratio: 16/9), (min-aspect-ratio: 16/9) {
            #quiz-overlay {
                padding: 1.5vh 4vw;
            }
        }
        #quiz-overlay::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(180, 20, 60, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        #quiz-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('chat/assets/slphialogo_color.png'),
                radial-gradient(circle at 20% 30%, rgba(180, 20, 60, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(111, 1, 37, 0.2) 0%, transparent 50%),
                linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.02) 50%, transparent 70%);
            background-size: 
                80% auto, /* ロゴを適切なサイズに縮小（画像全体が表示されるように） */
                100% 100%,
                100% 100%,
                100% 100%;
            background-position: 
                center center, /* ロゴを中央に配置 */
                center center,
                center center,
                center center;
            background-repeat: no-repeat;
            opacity: 0.15; /* ロゴを透過して薄く表示 */
            pointer-events: none; /* クリックイベントを無効化して、ボタンがクリックできるように */
            z-index: -1; /* 最背景として表示（他の要素の後ろに配置） */
        }
        #quiz-overlay.show {
            opacity: 1;
        }
        
        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
        }
        
        /* 問題文の前口上と実際の問題の間のスペースにタイマーを配置 */
        #quiz-question-wrapper {
            position: relative;
            width: 100%;
        }
        
        #quiz-question-intro {
            font-size: clamp(1.2em, 2.5vw, 1.8em); /* 16:9画面に応じて調整 */
            text-align: center;
            margin-bottom: 0;
            color: rgba(255, 255, 255, 0.9);
            min-height: 3vh;
            padding-bottom: 0; /* 空白を削除 */
        }
        
        /* タイマー表示（問題パネルの中央上に配置、16:9最適化） */
        #quiz-timer {
            position: absolute;
            top: -7vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2em, 4vw, 3em); /* 16:9画面に応じて調整 */
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 1002;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.6);
            padding: 1vh 2vw;
            border-radius: 8px;
            border: 2px solid #ffeb3b;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.5);
            text-align: center; /* 数値を中央揃え */
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px; /* 中央揃えを維持するための最小幅 */
        }
        
        #quiz-question-main {
            font-size: clamp(2.2em, 5vw, 3.5em); /* スクリーン投影用に大きく調整 */
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            margin-top: 0; /* リード文との間の空白を削除 */
            clear: both;
            color: white; /* 問題文の色を白色に統一 */
        }
        
        /* 選択肢Dから抽出したコメントを問題文に表示（リード文よりさらに小さい文字サイズ） */
        #quiz-question-comment {
            font-size: clamp(1em, 2vw, 1.5em); /* 16:9画面に応じて調整 */
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-top: 1.5vh;
            line-height: 1.5;
            font-weight: normal;
        }
        #quiz-timer.warning {
            color: #ff5252;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.8);
            border-color: #ff5252;
            box-shadow: 0 0 15px rgba(255, 82, 82, 0.5);
            animation: timerPulse 1s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
        
        /* 問題画像表示エリア（16:9最適化） */
        #quiz-image-container {
            width: 100%;
            max-width: 50vw; /* 16:9画面では横方向の50% */
            height: 25vh; /* 縦方向の25% */
            margin-bottom: 2vh;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #b4143c;
            box-shadow: 0 0 30px rgba(180, 20, 60, 0.6), 0 0 60px rgba(111, 1, 37, 0.4);
            position: relative;
            z-index: 1;
        }
        #quiz-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(135deg, #460117 0%, #6f0125 100%);
        }

        #quiz-question { 
            margin-bottom: 2vh; 
            margin-top: 8vh; /* タイマーのスペースを確保 */
            animation: fadeInUp 0.5s ease-out;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #b4143c;
            border-radius: 12px;
            padding: 1.5vh 3vw; /* 縦のpaddingを縮小（2vh → 1.5vh） */
            box-shadow: 0 0 30px rgba(180, 20, 60, 0.6), 0 0 60px rgba(111, 1, 37, 0.4);
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 85vw; /* 16:9画面では横方向の85% */
            visibility: visible;
            opacity: 1;
        }
        
        /* quiz-questionが非表示状態のクラス（画面外に移動） */
        #quiz-question.hidden {
            position: absolute;
            left: -9999px;
            top: -9999px;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        
        #quiz-question-number {
            text-align: center;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 700;
            color: #b4143c;
            margin-bottom: 1.5vh;
            text-shadow: 0 0 10px rgba(180, 20, 60, 0.9), 0 0 20px rgba(111, 1, 37, 0.6);
        }
        
        #quiz-options { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 2vw; 
            width: 100%;
            max-width: 85vw; /* 16:9画面では横方向の85% */
        }
        .option-btn {
            background: rgba(0, 0, 0, 0.8); 
            color: white; 
            border: 3px solid #b4143c;
            padding: 2vh 2vw; 
            font-size: clamp(1.2em, 2.5vw, 1.8em); /* 16:9画面に応じて調整 */
            font-weight: bold; 
            border-radius: 12px;
            cursor: pointer; 
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, border-width 0.3s, background 0.3s; 
            box-shadow: 0 0 20px rgba(180, 20, 60, 0.4), 0 0 40px rgba(111, 1, 37, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            min-height: 12vh; /* 16:9画面では縦方向の12% */
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
            animation-fill-mode: forwards;
        }
        
        .option-btn-content {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .option-vote-percentage {
            font-size: clamp(1.5em, 3vw, 2.5em);
            font-weight: 700;
            color: var(--sophia-claret-light);
            text-shadow: 0 0 10px rgba(180, 20, 60, 0.8);
            margin-left: 1vw;
            min-width: 60px;
            text-align: right;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: #b4143c;
            transition: width 0.3s;
        }
        .option-btn:nth-child(1) { animation-delay: 0.1s; }
        .option-btn:nth-child(2) { animation-delay: 0.2s; }
        .option-btn:nth-child(3) { animation-delay: 0.3s; }
        .option-btn:nth-child(4) { animation-delay: 0.4s; }
        .option-btn:hover:not(.disabled) { 
            transform: translateY(-5px) scale(1.02) !important; 
            box-shadow: 
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.6),
                0 0 60px rgba(255, 0, 0, 0.4),
                0 0 80px rgba(180, 20, 60, 0.3),
                inset 0 0 30px rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
            border-width: 4px;
            background: rgba(255, 0, 0, 0.1);
            animation: neonPulse 1.5s ease-in-out infinite;
            animation-fill-mode: forwards;
        }
        .option-btn:hover:not(.disabled)::before {
            width: 100%;
            opacity: 0.3;
            background: #ff0000;
        }

        @keyframes neonPulse {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(255, 0, 0, 0.8),
                    0 0 40px rgba(255, 0, 0, 0.6),
                    0 0 60px rgba(255, 0, 0, 0.4),
                    0 0 80px rgba(180, 20, 60, 0.3),
                    inset 0 0 30px rgba(255, 0, 0, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(255, 0, 0, 1),
                    0 0 60px rgba(255, 0, 0, 0.8),
                    0 0 90px rgba(255, 0, 0, 0.6),
                    0 0 120px rgba(180, 20, 60, 0.5),
                    inset 0 0 40px rgba(255, 0, 0, 0.3);
            }
        }
        .option-btn:active:not(.disabled) { 
            transform: translateY(2px) scale(0.98); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .option-btn.correct {
            background: #4CAF50;
            color: white;
            animation: correctPulse 0.6s ease-out;
        }
        .option-btn.incorrect {
            background: #f44336;
            color: white;
            animation: shake 0.5s ease-out;
        }
        .option-btn.show-correct {
            background: #4CAF50;
            color: white;
            border: 3px solid #fff;
        }

        #quiz-feedback {
            margin-top: 3vh;
            font-size: clamp(1.8em, 4vw, 2.8em); /* 16:9画面に応じて調整、問題文と同じサイズ */
            font-weight: bold;
            text-align: center;
            min-height: 5vh;
            animation: fadeInUp 0.5s ease-out;
            max-width: 85vw; /* 16:9画面では横方向の85% */
            display: none; /* 初期状態では非表示（問題画面では不要） */
        }

        /* 正解/不正解画像 */
        .quiz-result-image {
            display: block;
            margin: 0;
            width: clamp(120px, 16vw, 240px); /* 20%縮小（元の80%） */
            height: auto;
            animation: fadeInScale 0.6s ease-out;
            flex-shrink: 0; /* 縮小を防ぐ */
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        #quiz-feedback.correct {
            color: #4CAF50;
        }
        #quiz-feedback.incorrect {
            color: #ffeb3b;
        }

        #quiz-explanation {
            margin-top: 2vh;
            font-size: clamp(1.8em, 4vw, 2.8em); /* 16:9画面に応じて調整、問題文と同じサイズ */
            text-align: center;
            max-width: 85vw; /* 16:9画面では横方向の85% */
            line-height: 1.6;
            padding: 2vh 3vw;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            animation: fadeInUp 0.5s ease-out;
            display: none; /* 初期状態では非表示（問題画面では不要） */
        }
        
        /* 解説内の画像スタイル */
        #quiz-explanation img {
            max-width: 100%;
            height: auto;
            margin: 2vh auto;
            border-radius: 8px;
            display: block;
        }

        #quiz-actions {
            margin-top: 3vh;
            display: none; /* 初期状態では非表示（問題画面では不要） */
            gap: 1.5vw;
            animation: fadeInUp 0.5s ease-out;
            justify-content: center;
            position: relative;
            z-index: 10; /* ボタンが他の要素の上に表示されるように */
        }
        
        /* アクションボタンが必要な時は表示 */
        #quiz-actions:not(:empty) {
            display: flex;
        }
        .quiz-action-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: clamp(1em, 2vw, 1.5em); /* 16:9画面に応じて調整 */
            padding: 1.5vh 3vw;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            position: relative;
            z-index: 11; /* ボタンが確実にクリックできるように */
            pointer-events: auto; /* クリックイベントを有効化 */
        }
        .quiz-action-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        #close-overlay { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            background: rgba(255,255,255,0.2); 
            border: 1px solid white; 
            color: white; 
            font-size: 1rem; 
            padding: 10px 20px; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: background 0.2s;
            z-index: 1002; /* QRコードより上に表示 */
        }
        #close-overlay:hover {
            background: rgba(255,255,255,0.4);
        }
        
        /* QRコードスタイル */
        #quiz-qr-code {
            position: absolute;
            top: 80px; /* 閉じるボタンの下に配置（30px + パディング + マージン） */
            right: 2vw;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            padding: 1vh 1vw;

        // 問題文からキーワードを抽出
        function extractKeywords(question) {
            // 日本語のキーワードを抽出
            const keywords = [];
            
            // 上智大学関連のキーワード
            if (question.includes('上智') || question.includes('ソフィア')) {
                keywords.push('Sophia University');
            }
            if (question.includes('キャンパス')) {
                keywords.push('university campus');
            }
            if (question.includes('歴史')) {
                keywords.push('history');
            }
            if (question.includes('建物') || question.includes('建築')) {
                keywords.push('architecture');
            }
            if (question.includes('学生')) {
                keywords.push('students');
            }
            if (question.includes('図書館')) {
                keywords.push('library');
            }
            if (question.includes('四ツ谷') || question.includes('Yotsuya')) {
                keywords.push('Yotsuya Tokyo');
            }
            
            // 年号や数字が含まれている場合
            const yearMatch = question.match(/\d{4}年/);
            if (yearMatch) {
                keywords.push('university');
            }
            
            // キーワードが見つからない場合、デフォルト
            if (keywords.length === 0) {
                keywords.push('university', 'education');
            }
            
            return keywords;

                });

                    // クイズが検出されたらクイズカードを表示
                    addQuizCard(quizData);
                } else {
                    // クイズでなければ（普通の会話なら）そのまま表示
                    addMessage(aiResponse, 'bot');
                }

            } catch (error) {
                console.error('API request error:', error);
                const loadingMsg = document.getElementById(loadingId);
                if(loadingMsg) loadingMsg.innerText = "エラーが発生しました。通信環境などを確認してください。";
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.id = isLoading ? 'loading-msg' : '';

            if (sender === 'bot') {
                // HTMLタグ（<br>など）を適切に処理するため、innerHTMLを使用
                // XSS対策として、基本的なHTMLタグのみ許可
                const sanitizedText = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                    .replace(/\n/g, '<br>')
                    .replace(/<br\s*\/?>\s*<br\s*\/?>/gi, '<br>');
                div.innerHTML = `<div class="message-text">${sanitizedText}</div>`;
            } else {
                // ユーザーのメッセージはテキストのまま（HTMLタグはエスケープ）
                div.innerText = text;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.id;
        }

        // クイズを検出する関数（Difyプロンプトに基づくテキスト形式を優先）
        function detectQuiz(text) {
            // HTMLタグを一時的に置換して処理しやすくする
            const normalizedText = text.replace(/<br\s*\/?>/gi, '\n').replace(/&nbsp;/g, ' ');
            
            // 方法1: JSON形式を検出（フォールバック）
            try {
                let cleanJson = normalizedText.replace(/```json/g, '').replace(/```/g, '').trim();
                const quizData = JSON.parse(cleanJson);
                if (quizData.question && quizData.options && Array.isArray(quizData.options)) {
                    // correctAnswerを正規化（A~D形式または数値インデックスに対応）
                    if (quizData.correctAnswer !== undefined && quizData.correctAnswer !== null) {
                        if (typeof quizData.correctAnswer === 'string') {
                            const letterIndex = quizData.correctAnswer.toUpperCase().charCodeAt(0) - 'A'.charCodeAt(0);
                            if (letterIndex >= 0 && letterIndex < 4) {
                                quizData.correctAnswer = letterIndex;
                            } else {
                                quizData.correctAnswer = null;
                            }
                        } else if (typeof quizData.correctAnswer === 'number') {
                            if (quizData.correctAnswer < 0 || quizData.correctAnswer >= 4) {
                                quizData.correctAnswer = null;
                            }
                        }
                    }
                    if (quizData.options.length === 4) {
                        return quizData;
                    }
                }
            } catch (e) {
                // JSONパースに失敗した場合は次の方法を試す
            }

            // 方法2: Difyプロンプトに基づくテキスト形式を検出（優先）
            // プロンプトでは問題文の後に選択肢が<br><br>で区切られて出力される
            
            // 問題文を検出（冒頭のテキスト、または「問題:」「Q:」などのパターン）
            let question = '';
            let questionEndIndex = 0;
            
            // パターン1: 明示的な問題マーカーがある場合
            const questionPattern = /(?:問題|Q|クイズ)[:：]\s*(.+?)(?:\n|$)/i;
            const questionMatch = normalizedText.match(questionPattern);
            if (questionMatch) {
                question = questionMatch[1].trim();
                questionEndIndex = questionMatch.index + questionMatch[0].length;
            } else {
                // パターン2: 選択肢の前のテキストを問題文とする
                // A~Dで始まる行の前のテキストを問題文とみなす
                const firstOptionMatch = normalizedText.match(/[A-D][\.．、：\s]/i);
                if (firstOptionMatch) {
                    question = normalizedText.substring(0, firstOptionMatch.index).trim();
                    questionEndIndex = firstOptionMatch.index;
                }
            }
            
            if (!question) {
                return null;
            }
            
            // 選択肢を検出（A~D形式、<br><br>または改行で区切られている）
            // プロンプトでは「A. 選択肢1<br><br>B. 選択肢2<br><br>...」の形式
            const options = [];
            const optionLabels = ['A', 'B', 'C', 'D'];
            
            // 残りのテキストから選択肢を抽出
            const remainingText = normalizedText.substring(questionEndIndex).trim();
            
            // 方法1: A~D形式の選択肢を個別に厳密に抽出
            // 各選択肢を個別に抽出し、明らかなコメントパターンで終了させる
            const foundOptions = [];
            let extractedComment = ''; // 選択肢Dから抽出したコメントを保存
            
            // 選択肢の終了を検出するキーワード（コメントの開始を示す）
            const commentStartKeywords = [
                '好きな', '答えて', '正解', '教えて', '言えば', '志', 'お金', 'ソフィアン',
                'ちゃんと', '解説', 'セット', '出す', 'ね!', 'ね。', 'よ。', 'よ?',
                'さあ', 'どれだ', '※', '博報堂', 'パワー', '一発', 'いける', 'でしょ',
                'A~D', 'A-D', '(A~D)', '(A-D)', 'を答えて', 'を選んで'
            ];
            
            // A, B, C, Dの順に選択肢を抽出
            for (let i = 0; i < 4; i++) {
                const label = optionLabels[i];
                const labelPattern = new RegExp(`([${label}])[\.．、：\\s]+`, 'i');
                const labelMatch = remainingText.match(labelPattern);
                
                if (!labelMatch) continue;
                
                const startIndex = labelMatch.index + labelMatch[0].length;
                let endIndex = remainingText.length;
                
                // 次の選択肢のラベルを探す
                if (i < 3) {
                    const nextLabel = optionLabels[i + 1];
                    const nextLabelPattern = new RegExp(`\\n\\n+[${nextLabel}][\\.．、：\\s]`, 'i');
                    const nextLabelMatch = remainingText.substring(startIndex).match(nextLabelPattern);
                    if (nextLabelMatch) {
                        endIndex = startIndex + nextLabelMatch.index;
                    }
                }
                
                // 選択肢のテキストを抽出
                let fullContent = remainingText.substring(startIndex, endIndex).trim();
                let content = fullContent;
                
                // コメントキーワードで終了させる
                let earliestCommentIndex = content.length;
                for (const keyword of commentStartKeywords) {
                    const keywordIndex = content.indexOf(keyword);
                    if (keywordIndex > 0 && keywordIndex < earliestCommentIndex) {
                        earliestCommentIndex = keywordIndex;
                    }
                }
                
                // コメント部分を抽出（選択肢Dの場合のみ）
                if (i === 3 && earliestCommentIndex < content.length) {
                    // 選択肢Dのコメント部分を保存
                    extractedComment = content.substring(earliestCommentIndex).trim();
                    content = content.substring(0, earliestCommentIndex).trim();
                } else if (earliestCommentIndex < content.length) {
                    // 他の選択肢の場合はコメントを除去
                    content = content.substring(0, earliestCommentIndex).trim();
                }
                
                // 選択肢の長さ制限（50文字を超える場合は最初の50文字まで）
                if (content.length > 50) {
                    // 句点、疑問符、改行で区切って最初の部分だけを取得
                    const sentences = content.split(/[。？\?\n]/);
                    if (sentences.length > 1 && sentences[0].trim().length <= 50) {
                        content = sentences[0].trim();
                    } else {
                        // 50文字まで
                        content = content.substring(0, 50).trim();
                        // 最後の句点まで
                        const lastPeriod = content.lastIndexOf('。');
                        if (lastPeriod > 0) {
                            content = content.substring(0, lastPeriod + 1);
                        }
                    }
                }
                
                // 余分な改行や空白を整理
                content = content.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
                
                // 選択肢が空でない場合のみ追加
                if (content && content.length > 0) {
                    foundOptions.push({
                        label: label,
                        content: content,
                        index: i
                    });
                }
            }
            
            // ラベル順（A, B, C, D）にソート
            foundOptions.sort((a, b) => a.index - b.index);
            
            // 4つの選択肢が順番に揃っているか確認
            if (foundOptions.length === 4) {
                // すべてA, B, C, Dの順になっているか確認
                const isSequential = foundOptions.every((opt, idx) => opt.index === idx);
                if (isSequential) {
                    options.push(...foundOptions.map(opt => opt.content));
                }
            }
            
            // 方法2: もしパターンマッチで4つ見つからなかった場合、改行区切りで試す
            if (options.length < 4) {
                // <br><br>や改行で区切られたブロックを選択肢とみなす
                const blocks = remainingText.split(/\n\n+/).filter(block => block.trim().length > 0);
                for (let i = 0; i < Math.min(blocks.length, 4); i++) {
                    const block = blocks[i].trim();
                    // A~Dのラベルを除去して内容だけを取得
                    const cleanBlock = block.replace(/^[A-D][\.．、：\s]+/i, '').trim()
                        .replace(/\n+/g, ' ')
                        .replace(/\s+/g, ' ');
                    if (cleanBlock && options.length < 4) {
                        if (options.length === 0 || !options.includes(cleanBlock)) {
                            options.push(cleanBlock);
                        }
                    }
                }
            }
            
            // 選択肢が4つ揃っているか確認
            if (options.length === 4) {
                // 正解を検出（「正解：[記号]」の形式、プロンプトに基づく）
                let correctAnswer = null;
                
                // パターン1: 「正解：A」形式
                const answerPattern1 = /正解[:：]\s*([A-D])/i;
                const answerMatch1 = normalizedText.match(answerPattern1);
                if (answerMatch1) {
                    const letter = answerMatch1[1].toUpperCase();
                    correctAnswer = letter.charCodeAt(0) - 'A'.charCodeAt(0);
                } else {
                    // パターン2: 「答え：A」形式
                    const answerPattern2 = /答え[:：]\s*([A-D])/i;
                    const answerMatch2 = normalizedText.match(answerPattern2);
                    if (answerMatch2) {
                        const letter = answerMatch2[1].toUpperCase();
                        correctAnswer = letter.charCodeAt(0) - 'A'.charCodeAt(0);
                    }
                }
                
                // 解説を検出（プロンプトでは「解説：<br>[詳しい解説]」形式）
                let explanation = '';
                const explanationPattern = /解説[:：]\s*(.+?)(?:\n\n|\n正解|$)/is;
                const explanationMatch = normalizedText.match(explanationPattern);
                if (explanationMatch) {
                    explanation = explanationMatch[1].trim()
                        .replace(/\n+/g, ' ')
                        .replace(/\s+/g, ' ')
                        .replace(/<br\s*\/?>/gi, ' ');
                }
                
                // 選択肢Dから抽出したコメントを問題文に追加
                const quizData = {
                    question: question,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation
                };
                
                // 選択肢Dから抽出したコメントがある場合、問題文に追加
                if (extractedComment && extractedComment.length > 0) {
                    quizData.extractedComment = extractedComment;
                }
                
                return quizData;
            }
            
            return null;
        }

        function addQuizCard(quizData) {

            const div = document.createElement('div');
            div.className = 'message bot';
            
            // クイズデータを保存（全画面表示時に使用）

        // 固定クイズを開始（固定クイズデータから問題を表示）
        async function startFixedQuiz(questionNumber) {

                return;
            }
            
            // 第1問の場合はクイズ音楽を開始
            if (questionNumber === 1) {
                startQuizMusic();
            }
            
            const questionData = fixedQuizQuestions[questionNumber - 1];
            currentQuestionNumber = questionNumber;
            
            // Firebaseに現在の問題番号を設定（参加者フォームとの同期）
            try {
                const quizRef = database.ref('quizzes/current');
                
                // 第1問の場合は、クイズセッションを初期化
                if (questionNumber === 1) {

                    // ★重要：本番前にテストデータをクリア

                            console.log('削除するparticipantsデータはありません');

                    }
                    
                    // 既存のquestionsデータも削除（念のため）
                    try {

                    // クイズセッションを初期化

                        },

                    });
                } else {
                    // 2問目以降は問題番号のみ更新
                    await quizRef.update({
                        currentQuestion: questionNumber
                    });
                    
                    // 新しい問題の投票データを初期化
                    const questionRef = database.ref(`quizzes/current/questions/${questionNumber}`);
                    await questionRef.set({
                        votes: {
                            A: 0,
                            B: 0,
                            C: 0,
                            D: 0
                        },

                    });

            }
            
            // クイズデータを整形
            const quizData = {
                question: `${questionData.intro ? questionData.intro + '<br>' : ''}【問題】<br>${questionData.question}`,
                options: questionData.options,
                correctAnswer: questionData.correctAnswer,
                explanation: questionData.explanation,
                intro: questionData.intro,
                mainQuestion: questionData.question,
                comment: questionData.comment,
                images: questionData.images || [],
                imageScale: questionData.imageScale || 1.0
            };
            
            // 全画面表示
            await startQuiz(quizData);
            
            // 投票データをリアルタイム監視
            listenToVotes(questionNumber);
        }
        
        // ===== 投票データをリアルタイム監視 =====
        function listenToVotes(questionNumber) {
            if (!questionNumber || questionNumber < 1 || questionNumber > fixedQuizQuestions.length) {
                return;
            }
            
            // 既存のリスナーを削除
            if (currentVoteListener) {
                database.ref(`quizzes/current/questions/${questionNumber}/votes`).off('value', currentVoteListener);
                database.ref(`quizzes/current/questions/${questionNumber}/totalVotes`).off('value', currentVoteListener);
                currentVoteListener = null;
            }
            
            const votesRef = database.ref(`quizzes/current/questions/${questionNumber}/votes`);
            const totalVotesRef = database.ref(`quizzes/current/questions/${questionNumber}/totalVotes`);
            
            // 投票数の変更を監視
            const updateVotePercentages = () => {
                Promise.all([
                    votesRef.once('value'),
                    totalVotesRef.once('value')
                ]).then(([votesSnapshot, totalSnapshot]) => {
                    const votes = votesSnapshot.val() || { A: 0, B: 0, C: 0, D: 0 };
                    const totalVotes = totalSnapshot.val() || 0;
                    
                    // 各選択肢の投票率を計算して表示
                    const optionLabels = ['A', 'B', 'C', 'D'];
                    optionLabels.forEach(label => {
                        const voteCount = votes[label] || 0;
                        const percentage = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
                        
                        const percentageElement = document.getElementById(`vote-percentage-${label}`);
                        if (percentageElement) {
                            percentageElement.textContent = `${percentage}%`;
                        }
                    });
                }).catch((error) => {
                    console.error('投票データ取得エラー:', error);
                });
            };
            
            // 初期表示
            updateVotePercentages();
            
            // リアルタイム更新
            currentVoteListener = votesRef.on('value', updateVotePercentages);
            totalVotesRef.on('value', updateVotePercentages);
        }
        
        // 全画面モードを起動
        async function startQuiz(quizIdOrData) {
            const data = typeof quizIdOrData === 'string' ? window[quizIdOrData] : quizIdOrData;
            currentQuizData = data;
            quizAnswered = false;
            timeRemaining = 60;
            
            // オーバーレイを表示
            const overlay = document.getElementById('quiz-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('show'), 10);
            
            // 問題文を前口上と実際の問題に分離
            const questionText = data.question;
            let introText = '';
            let mainQuestion = questionText;
            
            // 固定クイズモードの場合、直接introとmainQuestionを使用
            if (isFixedQuizMode && data.intro && data.mainQuestion) {
                introText = data.intro;
                mainQuestion = data.mainQuestion;
            } else {
                // 問題文を解析して前口上を検出
                // 【問題】マーカーで区切る（プロンプト修正版に対応）
                const problemMarker = /【問題】/;
                const markerMatch = questionText.match(problemMarker);
                
                if (markerMatch) {
                    // 【問題】マーカーが見つかった場合
                    const markerIndex = markerMatch.index;
                    introText = questionText.substring(0, markerIndex).trim();
                    // 【問題】マーカーを除去して問題文を取得
                    mainQuestion = questionText.substring(markerIndex + markerMatch[0].length).trim();
                } else {
                    // 【問題】マーカーがない場合、従来の方法で検出（後方互換性のため）
                    const introPatterns = [
                        /^(.+?)(さあ[、,].+?[。\n])/i,
                        /^(.+?)(それでは.+?[。\n])/i,
                        /^(.+?)(では.+?[。\n])/i
                    ];
                    
                    for (const pattern of introPatterns) {
                        const match = questionText.match(pattern);
                        if (match && match[1] && match[2]) {
                            introText = match[1].trim();
                            mainQuestion = questionText.substring(match[0].length).trim();
                            break;
                        }
                    }
                    
                    // 前口上が見つからない場合、最初の文を前口上として扱う（短い場合）
                    if (!introText && questionText.length > 50) {
                        const firstSentence = questionText.split(/[。\n]/)[0];
                        if (firstSentence.length < 30 && firstSentence.length > 0) {
                            introText = firstSentence + '。';
                            mainQuestion = questionText.substring(introText.length).trim();
                        }
                    }
                }
            }
            
            // HTMLタグを適切に処理
            const safeIntro = introText
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                .replace(/\n/g, '<br>');
            const safeMain = mainQuestion
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                .replace(/\n/g, '<br>');
            
            // 問題エリアを設定
            const questionElement = document.getElementById('quiz-question');
            const questionWrapper = document.getElementById('quiz-question-wrapper');
            const questionIntro = document.getElementById('quiz-question-intro');
            const questionMain = document.getElementById('quiz-question-main');
            const questionComment = document.getElementById('quiz-question-comment');
            const questionNumber = document.getElementById('quiz-question-number');
            const timerElement = document.getElementById('quiz-timer');
            
            // 問題表示前に要素を完全にクリア（一瞬の表示を防ぐ）
            // まず、quiz-questionを画面外に移動して非表示にする
            if (questionElement) {
                // 確実に画面外に移動して非表示にする
                questionElement.classList.add('hidden');
                questionElement.style.animation = 'none';
                // 強制的にレンダリングを待つ
                questionElement.offsetHeight; // リフローを強制
                // さらに待つ
                await new Promise(resolve => requestAnimationFrame(resolve));
            }
            if (questionMain) {
                questionMain.innerHTML = '';
            }
            if (questionIntro) {
                questionIntro.innerHTML = '';
                questionIntro.style.display = 'none';
            }
            if (questionComment) {
                questionComment.innerHTML = '';
                questionComment.style.display = 'none';
            }
            if (questionNumber) {
                questionNumber.innerHTML = '';
            }
            
            // レンダリングを確実にする（複数回待つ）
            await new Promise(resolve => requestAnimationFrame(resolve));
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            // 固定クイズモード中の場合、問題番号を表示
            if (isFixedQuizMode && questionNumber) {
                questionNumber.textContent = `第${currentQuestionNumber}問 / 全${fixedQuizQuestions.length}問`;
                questionNumber.style.display = 'block';
            } else if (questionNumber) {
                questionNumber.style.display = 'none';
            }
            
            if (questionIntro && questionMain && timerElement) {
                // 前口上を設定
                const hasIntro = safeIntro && safeIntro.trim().length > 0;
                if (hasIntro) {
                    questionIntro.innerHTML = safeIntro;
                    questionIntro.style.display = 'block';
                } else {
                    questionIntro.style.display = 'none';
                }
                
                // 実際の問題を設定
                questionMain.innerHTML = safeMain;
                
                // 問題文の色を白色に統一
                questionMain.style.color = 'white';
                
                // Q2のフォントサイズを5%下げる
                if (isFixedQuizMode && currentQuestionNumber === 2) {
                    questionMain.style.fontSize = 'clamp(2.09em, 4.75vw, 3.33em)';
                } else {
                    questionMain.style.fontSize = 'clamp(2.2em, 5vw, 3.5em)';
                }
                
                // 選択肢Dから抽出したコメントを問題文に追加（小さい文字サイズ）
                // 固定クイズモードの場合は、commentフィールドは表示しない（問題文に含まれているため）
                // ただし、extractedCommentがある場合は表示する（Difyから生成されたクイズの場合）
                if (data.extractedComment && questionComment) {
                    const safeComment = data.extractedComment
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                        .replace(/\n/g, '<br>');
                    questionComment.innerHTML = safeComment;
                    questionComment.style.display = 'block';
                } else if (questionComment) {
                    questionComment.style.display = 'none';
                }
                
                // タイマーを問題パネルの上に配置
                timerElement.style.cssText = 'position: absolute !important; top: -70px !important; right: 20px !important; display: block !important;';
                
                // タイマーをリセット
                timerElement.textContent = timeRemaining;
                timerElement.classList.remove('warning');
            } else {
                // フォールバック: 従来の方法
                questionElement.innerHTML = '<div id="quiz-timer">' + timeRemaining + '</div>' + safeMain;
                const fallbackTimer = document.getElementById('quiz-timer');
                if (fallbackTimer) {
                    fallbackTimer.textContent = timeRemaining;
                    fallbackTimer.classList.remove('warning');
                }
            }
            
            // タイマーを開始
            startTimer();
            
            // すべての内容を設定した後、quiz-questionを表示（一瞬の表示を防ぐ）
            if (questionElement) {
                // レンダリングを確実にするために複数回待つ
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => requestAnimationFrame(resolve));
                
                // hiddenクラスを削除して正しい位置に戻す（アニメーションは無効化したまま）
                questionElement.style.animation = 'none';
                questionElement.style.position = 'relative'; // 正しい位置に戻す
                questionElement.style.left = '';
                questionElement.style.top = '';
                questionElement.classList.remove('hidden');
                
                // 強制的にレンダリングを待つ
                questionElement.offsetHeight; // リフローを強制
                
                // さらに待つ
                await new Promise(resolve => requestAnimationFrame(resolve));
                
                // 次のフレームでアニメーションを再有効化（フェードインアニメーションを実行）
                await new Promise(resolve => requestAnimationFrame(resolve));
                questionElement.style.animation = 'fadeInUp 0.5s ease-out';
            }
            
            // 問題に関連する画像を検索して表示
            const imageContainer = document.getElementById('quiz-image-container');
            const imageElement = document.getElementById('quiz-image');
            const imageUrl = await searchQuizImage(data.question);
            if (imageUrl) {
                imageElement.src = imageUrl;
                imageElement.onerror = () => {
                    imageContainer.style.display = 'none';
                };
                imageContainer.style.display = 'block';
            } else {
                imageContainer.style.display = 'none';
            }
            
            // 選択肢を表示（A~D形式で表示）
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            optionsContainer.style.display = 'grid'; // クイズ表示時は表示
            
            // 選択肢が4つであることを確認
            if (!data.options || data.options.length !== 4) {
                console.error('クイズの選択肢は4つである必要があります');
                return;
            }
            
            const optionLabels = ['A', 'B', 'C', 'D'];
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // 選択肢のテキストをエスケープ（HTMLタグを除去）
                const safeOpt = opt
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/<br\s*\/?>/gi, ' ')
                    .trim();
                
                // コンテンツ用のdivを作成
                const contentDiv = document.createElement('div');
                contentDiv.className = 'option-btn-content';
                
                // ラベルとテキストを分けて表示
                const labelSpan = document.createElement('span');
                labelSpan.className = 'option-label';
                labelSpan.textContent = optionLabels[index];
                contentDiv.appendChild(labelSpan);
                
                const textSpan = document.createElement('span');
                textSpan.textContent = safeOpt;
                contentDiv.appendChild(textSpan);
                
                btn.appendChild(contentDiv);
                
                // 投票率表示用の要素を追加
                const percentageSpan = document.createElement('span');
                percentageSpan.className = 'option-vote-percentage';
                percentageSpan.id = `vote-percentage-${optionLabels[index]}`;
                percentageSpan.textContent = '0%';
                btn.appendChild(percentageSpan);
                
                btn.dataset.index = index;
                btn.dataset.label = optionLabels[index];
                btn.onclick = () => selectAnswer(index, safeOpt, optionLabels[index]);
                optionsContainer.appendChild(btn);
            });
            
            // 固定クイズモードの場合、投票データをリアルタイム監視
            if (isFixedQuizMode && currentQuestionNumber >= 1 && currentQuestionNumber <= 10) {
                listenToVotes(currentQuestionNumber);
            }
            
            // フィードバックと説明をリセット（非表示にする）
            const feedbackDiv = document.getElementById('quiz-feedback');
            const explanationDiv = document.getElementById('quiz-explanation');
            const actionsDiv = document.getElementById('quiz-actions');
            
            if (feedbackDiv) {
                feedbackDiv.innerHTML = '';
                feedbackDiv.className = '';
                feedbackDiv.style.display = 'none';
            }
            if (explanationDiv) {
                explanationDiv.innerHTML = '';
                explanationDiv.style.display = 'none';
            }
            if (actionsDiv) {
                actionsDiv.innerHTML = '';
                actionsDiv.style.display = 'none';
            }
            
            // 選択肢のスタイルをリセット（前回の選択状態をクリア）
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('disabled', 'correct', 'incorrect', 'show-correct');
                btn.style.border = '';
                btn.style.backgroundColor = '';
            });
        }

        // 回答を選択したときの処理
        async function selectAnswer(selectedIndex, selectedText, selectedLabel) {
            if (quizAnswered) return;
            quizAnswered = true;
            
            // タイマーを停止
            stopTimer();
            
            const buttons = document.querySelectorAll('.option-btn');
            const actionsDiv = document.getElementById('quiz-actions');
            
            // 選択したボタンをハイライト
            buttons.forEach((btn, idx) => {
                if (idx === selectedIndex) {
                    btn.style.border = '3px solid #ffeb3b';
                    btn.style.backgroundColor = 'rgba(255, 235, 59, 0.2)';
                    btn.style.boxShadow = '0 0 30px rgba(255, 235, 59, 0.8)';
                } else {
                    btn.classList.add('disabled');
                }
            });
            
                // 選択した回答を保存
            currentQuizData.selectedAnswer = {
                index: selectedIndex,
                text: selectedText,
                label: selectedLabel
            };
            
            // 固定クイズモード中は、すぐにローカルで判定
            if (isFixedQuizMode) {
                checkFixedQuizAnswer(selectedIndex);
            } else {
                // 通常モードは「回答を送信する」ボタンを表示
                // 選択したテキストのみを送信（ラベルとテキストを分離）
                const cleanSelectedText = currentQuizData.options[selectedIndex].trim();
                const answerToSend = cleanSelectedText; // 直接選択肢のテキストを使用
                actionsDiv.style.display = 'flex';
                actionsDiv.innerHTML = `
                    <button class="quiz-action-btn" onclick="sendQuizAnswer('${selectedLabel}. ${answerToSend.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">
                        回答を送信する
                    </button>
                    <button class="quiz-action-btn" onclick="closeQuiz()">
                        閉じる
                    </button>
                `;
            }
        }
        
        // 固定クイズの回答をローカルで判定
        function checkFixedQuizAnswer(selectedIndex) {
            if (!currentQuizData || currentQuizData.correctAnswer === undefined) {
                return;
            }
            
            const isCorrect = selectedIndex === currentQuizData.correctAnswer;
            const correctLabel = ['A', 'B', 'C', 'D'][currentQuizData.correctAnswer];
            const correctOptionText = currentQuizData.options && currentQuizData.options[currentQuizData.correctAnswer] ? currentQuizData.options[currentQuizData.correctAnswer] : '';
            const explanation = currentQuizData.explanation || '';
            const images = currentQuizData.images || [];
            const imageScale = currentQuizData.imageScale || 1.0;
            
            // 選択肢のボタンを更新（正解・不正解の表示）
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.classList.add('disabled');
                if (idx === currentQuizData.correctAnswer) {
                    btn.classList.add('correct', 'show-correct');
                    btn.style.border = '3px solid #4caf50';
                    btn.style.backgroundColor = 'rgba(76, 175, 80, 0.3)';
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('incorrect');
                    btn.style.border = '3px solid #f44336';
                    btn.style.backgroundColor = 'rgba(244, 67, 54, 0.3)';
                }
            });
            
            // 結果画面を表示
            showFixedQuizResult(isCorrect, correctLabel, correctOptionText, explanation, images, imageScale);
        }
        
        // 固定クイズの結果画面を表示
        function showFixedQuizResult(isCorrect, correctLabel, correctOptionText, explanation, images = [], imageScale = 1.0) {
            // タイマーを非表示
            const timerElement = document.getElementById('quiz-timer');
            if (timerElement) {
                timerElement.style.display = 'none';
            }
            
            // Firebaseに問題を締め切るフラグを設定（正解表示時点で回答締め切り）
            if (currentQuestionNumber >= 1 && currentQuestionNumber <= fixedQuizQuestions.length) {
                try {
                    database.ref(`quizzes/current/questions/${currentQuestionNumber}`).update({
                        closed: true,
                        closedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                } catch (error) {
                    console.error('Firebase更新エラー:', error);
                }
            }
            
            // 問題エリアに判定を表示
            const questionWrapper = document.getElementById('quiz-question-wrapper');
            const questionIntro = document.getElementById('quiz-question-intro');
            const questionMain = document.getElementById('quiz-question-main');
            const questionComment = document.getElementById('quiz-question-comment');
            
            // 前口上とコメントを非表示
            if (questionIntro) questionIntro.style.display = 'none';
            if (questionComment) questionComment.style.display = 'none';
            
            // 判定を表示（テキストと画像を横並びに）
            if (questionMain) {
                const judgment = isCorrect ? '正解！' : '残念、不正解！';
                const imagePath = isCorrect ? 'chat/assets/maru.png' : 'chat/assets/batsu.png';
                const imageAlt = isCorrect ? '正解' : '不正解';
                questionMain.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; gap: 2vw;">
                        <img src="${imagePath}" alt="${imageAlt}" class="quiz-result-image">
                        <div style="font-size: clamp(2rem, 4vw, 3.5rem); color: ${isCorrect ? '#4caf50' : '#f44336'};">
                            ${judgment}
                        </div>
                    </div>
                `;
                questionMain.style.fontSize = 'clamp(2rem, 4vw, 3.5rem)';
                questionMain.style.textAlign = 'center';
                questionMain.style.color = isCorrect ? '#4caf50' : '#f44336';
            }
            
            // 選択肢エリアを非表示
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.style.display = 'none';
            
            // 正解と解説を表示
            const feedbackDiv = document.getElementById('quiz-feedback');
            const explanationDiv = document.getElementById('quiz-explanation');
            
            if (feedbackDiv) {
                const correctText = correctOptionText ? `正解：${correctLabel} ${correctOptionText}` : `正解：${correctLabel}`;
                feedbackDiv.innerHTML = correctText;
                feedbackDiv.style.display = 'block';
                feedbackDiv.className = isCorrect ? 'correct' : 'incorrect';
            }
            
            if (explanationDiv) {
                // 解説文と画像を組み合わせて表示
                let explanationHtml = explanation.replace(/\n/g, '<br>');
                
                // 画像がある場合は追加
                if (images && images.length > 0) {
                    // 画像を拡大する場合、実際のレイアウトスペースを確保するためにコンテナを使用
                    const imagesHtml = images.map((img, index) => {
                        const isLastImage = index === images.length - 1;
                        const scaleStyle = imageScale !== 1.0 
                            ? `style="transform: scale(${imageScale}); transform-origin: center top; display: block; margin: 2vh auto;"` 
                            : `style="display: block; margin: 2vh auto;"`;
                        
                        // 最後の画像の下に十分なスペースを確保（拡大率に応じて）
                        let imageWithSpacer = `<img src="${img}" alt="解説画像" ${scaleStyle}>`;
                        if (isLastImage && imageScale > 1.0) {
                            // 拡大された画像の下にスペーサーを追加
                            const spacerHeight = `${(imageScale - 1) * 30 + 10}vh`;
                            imageWithSpacer += `<div style="height: ${spacerHeight}; display: block;"></div>`;
                        } else if (isLastImage) {
                            // 通常サイズでも下にスペースを確保
                            imageWithSpacer += `<div style="height: 5vh; display: block;"></div>`;
                        }
                        
                        return imageWithSpacer;
                    }).join('<br>'); // 画像の間に改行を追加
                    
                    // 解説文が空の場合は画像のみ、そうでない場合は解説文の後に画像
                    if (explanation.trim() === '') {
                        explanationHtml = imagesHtml;
                    } else {
                        explanationHtml = explanationHtml + '<br>' + imagesHtml;
                    }
                }
                
                explanationDiv.innerHTML = explanationHtml;
                explanationDiv.style.display = 'block';
            }
            
            // アクションボタンを表示
            const actionsDiv = document.getElementById('quiz-actions');
            if (actionsDiv) {
                actionsDiv.style.display = 'flex';
                
                // 最後の問題かどうかでボタンを変える
                if (currentQuestionNumber >= fixedQuizQuestions.length) {
                    // 最後の問題：終了ボタンのみ
                    actionsDiv.innerHTML = `
                        <button class="quiz-action-btn" onclick="endFixedQuiz()">
                            クイズ終了
                        </button>
                    `;
                } else {
                    // 次の問題へ進むボタン
                    actionsDiv.innerHTML = `
                        <button class="quiz-action-btn" onclick="nextFixedQuizQuestion()">
                            次の問題へ
                        </button>
                    `;
                }
            }
        }
        
        // 次の問題に進む
        async function nextFixedQuizQuestion() {
            // 前の問題の結果画面を即座に非表示にする
            const feedbackDiv = document.getElementById('quiz-feedback');
            const explanationDiv = document.getElementById('quiz-explanation');
            const actionsDiv = document.getElementById('quiz-actions');
            const questionElement = document.getElementById('quiz-question');
            const questionMain = document.getElementById('quiz-question-main');
            const questionIntro = document.getElementById('quiz-question-intro');
            const questionComment = document.getElementById('quiz-question-comment');
            const questionNumber = document.getElementById('quiz-question-number');
            const optionsContainer = document.getElementById('quiz-options');
            
            // すべての要素を即座に非表示にして内容をクリア
            if (feedbackDiv) {
                feedbackDiv.style.display = 'none';
                feedbackDiv.innerHTML = '';
            }
            if (explanationDiv) {
                explanationDiv.style.display = 'none';
                explanationDiv.innerHTML = '';
            }
            if (actionsDiv) {
                actionsDiv.style.display = 'none';
                actionsDiv.innerHTML = '';
            }
            // quiz-questionを完全に非表示にしてから内容をクリア
            if (questionElement) {
                // 即座に画面外に移動して非表示にする
                questionElement.classList.add('hidden');
                questionElement.style.animation = 'none';
                // 強制的にレンダリングを待つ
                questionElement.offsetHeight; // リフローを強制
                // さらに待つ
                await new Promise(resolve => requestAnimationFrame(resolve));
            }
            if (questionMain) {
                questionMain.innerHTML = '';
            }
            if (questionIntro) {
                questionIntro.innerHTML = '';
                questionIntro.style.display = 'none';
            }
            if (questionComment) {
                questionComment.innerHTML = '';
                questionComment.style.display = 'none';
            }
            if (questionNumber) {
                questionNumber.innerHTML = '';
            }
            if (optionsContainer) {
                optionsContainer.innerHTML = '';
                optionsContainer.style.display = 'none';
            }
            
            // レンダリングを確実にするために少し待つ
            await new Promise(resolve => requestAnimationFrame(resolve));
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            currentQuestionNumber++;
            await startFixedQuiz(currentQuestionNumber);
            
            // アニメーションを再有効化（startFixedQuiz内で表示される）
            if (questionElement) {
                questionElement.style.animation = '';
            }
        }
        
        // 固定クイズを終了
        async function endFixedQuiz() {
            isFixedQuizMode = false;
            currentQuestionNumber = 0;
            
            // 投票リスナーを削除
            if (currentVoteListener) {
                if (currentQuestionNumber >= 1 && currentQuestionNumber <= 10) {
                    database.ref(`quizzes/current/questions/${currentQuestionNumber}/votes`).off('value', currentVoteListener);
                    database.ref(`quizzes/current/questions/${currentQuestionNumber}/totalVotes`).off('value', currentVoteListener);
                }
                currentVoteListener = null;
            }
            
            // クイズ音楽を停止し、チャット音楽を再開
            stopQuizMusic();
            
            closeQuiz();
            
            // Firebaseのクイズステータスを終了に更新
            try {
                const quizRef = database.ref('quizzes/current');
                // currentQuestionを削除してから、statusを更新
                await quizRef.child('currentQuestion').remove();
                await quizRef.update({
                    status: 'ended',
                    endedAt: firebase.database.ServerValue.TIMESTAMP
                });
            } catch (error) {
                console.error('Firebase更新エラー:', error);
            }
            
            // 終了メッセージをチャットに表示
            addMessage(`全${fixedQuizQuestions.length}問終了しました！お疲れ様でした！`, 'bot');
            
            // ランキングを表示するボタンを表示
            const rankingButtonMessage = document.createElement('div');

            rankingButtonMessage.innerHTML = `
                <div class="message-text" style="text-align: center;">

                        color: white;
                        border: none;
                        padding: 15px 40px;
                        font-size: clamp(1.2rem, 3vw, 1.8rem);
                        font-weight: bold;
                        border-radius: 50px;
                        cursor: pointer;
                        box-shadow: 0 4px 15px rgba(158, 27, 50, 0.4);
                        transition: all 0.3s ease;

                    " onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 20px rgba(158, 27, 50, 0.6)';"

                        ランキングを表示する
                    </button>

            `;
            document.getElementById('chat-container').appendChild(rankingButtonMessage);

        // ランキングを表示する関数
        function showRanking() {
